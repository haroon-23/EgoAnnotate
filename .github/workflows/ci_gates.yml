name: EgoAnnotate Verification Gates & Pytest CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-gates-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies (FFmpeg & OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lock gates/ as Read-Only (Rule R1)
        run: chmod -R a-w gates/

      - name: Run Gate 01 (No Hardcoded Verdicts)
        run: python gates/g01_no_hardcoded_verdicts.py

      - name: Run Gate 02 (Negative Controls)
        run: python gates/g02_negative_controls.py

      - name: Run Gate 12 (Pytest Suite & Signal-Level Test Hygiene)
        run: python gates/g12_tests_hygiene.py
