# Retargeting configuration for Franka Panda
# Used as the default robot. Switch to a different robot by pointing --config
# at configs/retargeting_kuka.yaml (or any other robot-specific config).
#
# ALL robot-specific settings (URDF path, end-effector, gripper joints, workspace)
# live here — no code changes required to swap robots.

robot:
  # Path to URDF. null = use the bundled Franka Panda from pybullet_data.
  target_urdf_path: null

  # Name of the link to use as the IK end-effector target.
  # Must be a valid link name in the loaded URDF.
  end_effector_link: "panda_link8"

  # Names of the prismatic gripper finger joints in the URDF.
  # Leave empty ([]) if the robot has no gripper in the URDF.
  gripper_joint_names:
    - "panda_finger_joint1"
    - "panda_finger_joint2"

  # Robot workspace bounds (metres, in robot base frame).
  # The human wrist trajectory is linearly mapped into this box.
  # Tuned for Franka Panda tabletop manipulation reach envelope.
  # CRITICAL: z_min must clear the table top (z=0.25 m, see table below).
  # The 2026-10-08 real-verification failure (M1 tracking 0.52 rad) was caused
  # by z_min=0.20 placing wrist targets INSIDE the table — every "reachable"
  # IK solution had the arm buried in the tabletop, and the M1 contact solver
  # fought the position servos. z_min=0.35 keeps the wrist 10 cm above the
  # table; the table-collision gate (ik_solver.table_check) rejects any
  # residual penetrations from arm geometry.
  workspace_bounds:
    x_min: 0.30
    x_max: 0.65
    y_min: -0.30
    y_max: 0.30
    z_min: 0.35
    z_max: 0.65

  # Static table geometry (metres, robot base frame) — must match the
  # verification scene in episode_verifier.py (TABLE_POS/TABLE_SIZE).
  # The IK solver loads this as a collision body and marks any IK solution
  # that penetrates it as unreachable (table-collision gate).
  table:
    center: [0.5, 0.0, 0.125]      # box center
    half_extents: [0.35, 0.30, 0.125]  # half sizes; top surface at z=0.25

  # Phase E: IK backend selector — "pybullet" (default) or "mink" (opt-in;
  # needs the mujoco + mink packages: pip install mujoco mink).
  ik_backend: "pybullet"

pose_mapper:
  preferred_hand: "right"    # "right" | "left" | "auto"
  z_floor_m: 0.30            # minimum EE height: must clear the table top (z=0.25 m).
                             # (2026-10-08: was 0.10, which allowed below-table targets
                             # that the M1 verifier could never track.)
  orientation_scale: 1.0     # 1.0 = full wrist rotation, reduce if IK becomes unstable
  enable_trajectory_smoothing: true
  smoothing_window: 9
  smoothing_polyorder: 2
  enable_metric_calibration: true


ik_solver:
  max_iterations: 200
  residual_threshold_m: 0.005   # 5 mm — frame marked unreachable if exceeded
  joint_damping: 0.005
  num_attempts: 3               # random restarts per frame to escape local minima
  continuity_weight: 0.1        # m residual-equivalent per rad of branch deviation —
                                # keeps best-of-N selection on one IK branch across frames
                                # (fixes the 2026-10-03 real-verification M1 failure)
  collision_penalty: 1.0        # selection-score penalty for table/self-colliding IK
                                # attempts — a clean attempt always beats a colliding
                                # one; returned residual stays truthful
                                # (fixes the Run #3 509-table-gated/29.2% failure)
  # Table-collision gate (2026-10-08): the IK solver loads the static table
  # (robot.table above) as a PyBullet collision body. Any IK solution whose
  # arm links penetrate the table is marked unreachable — the M1 verifier's
  # contact solver would otherwise fight the position servos, producing a
  # large spurious "tracking error" (Run #2: 0.52 rad from 189/189 frames
  # with the arm inside the tabletop).
  table_check_enabled: true
  table_penetration_tol_m: 0.002  # reject if penetration exceeds 2 mm

# Phase E: IK backend selector. "pybullet" (default) or "mink" (opt-in;
# needs the mujoco + mink packages: pip install mujoco mink).
# ik_backend lives under robot: so it stays with the other robot settings.
mink_ik:
  residual_threshold_m: 0.01    # 10 mm — frame marked unreachable if exceeded
  # dt: 0.03333333333333333     # integration timestep per frame (default 1/30)
  position_cost: 1.0
  orientation_cost: 1.0         # 0.0 = position-only IK
  lm_damping: 0.001
  solver: "quadprog"            # tried first; falls back to "daqp", then default
  use_posture_task: true
  use_limit_tasks: true

gripper_mapper:
  confidence_threshold: 0.6    # grasp_type used if confidence >= this, else continuous_distance
  hand_ref_size_m: 0.18        # reference adult hand size for continuous_distance scaling
  smoothing_alpha: 0.3         # exponential smoothing [0=none, 1=hold]

output:
  output_dir: "data/output/retargeting"
