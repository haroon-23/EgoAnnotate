runtime:
  profile: gpu_prod
  device: cuda
  mixed_precision: fp16
  num_workers: 8
  chunk_size_frames: 150
  chunk_overlap_frames: 10
  target_fps: 30.0
  normalize_fps_cfr: true
  use_nvdec: true
  process_full_video: true
  cache_dir: .ego_cache
  offline_mode: false
  allow_non_commercial_plugins: false

perception:
  hand_backend: rtmw_133_apache
  body_backend: mediapipe_pose
  detector_backend: grounding_dino_apache
  segmenter_backend: sam21_apache
  hand_min_detection_conf: 0.35
  hand_min_tracking_conf: 0.50
  max_num_hands: 2
  enable_upper_body: true
  body_sample_stride: 1
  smoothing_method: one_euro
  one_euro_min_cutoff: 1.8
  one_euro_beta: 0.06
  gpu_batch_size: 8
  open_vocab_prompts:
    - tool
    - scissors
    - sewing machine
    - fabric
    - cloth
    - shirt
    - garment
    - measuring tape
    - pen
    - trowel
    - shovel
    - concrete roller
    - welding torch
    - metal rod
    - metal sheet
    - metal tray
    - metal press
    - plastic bag
    - plastic bin
    - box
    - container
    - bottle
    - cup
    - work glove

geometry:
  vo_backend: dpvo_mit
  depth_backend: moge2_mit
  depth_provenance: auto
  auto_estimate_intrinsics: true
  estimate_distortion: true
  assumed_palm_width_m: 0.085
  gravity_align: true
  loop_closure_enabled: true
  vo_max_features: 1200
  vo_resize_width: 960
  depth_sample_stride: 2

behavior:
  min_segment_duration_s: 0.35
  merge_gap_s: 0.25
  contact_proximity_m: 0.09
  grasp_pinch_aperture_m: 0.045
  grasp_power_aperture_m: 0.11
  compute_scene_graph: true
  compute_affordances: true

tactile:
  enable_rgb_proxies: true
  external_tactile_path: null
  slip_velocity_threshold_mps: 0.12
  impact_accel_threshold_mps2: 4.5

semantic:
  vlm_backend: qwen3_vl_local
  model_id: Qwen/Qwen3-VL-4B-Instruct
  vllm_base_url: null
  max_keyframes_per_segment: 6
  generate_paraphrases: true
  verify_against_geometry: true

quality:
  min_overall_score: 0.65
  warn_overall_score: 0.80
  min_hand_visibility: 0.30
  min_sharpness_laplacian: 25.0
  min_exposure_luma: 28.0
  max_exposure_luma: 235.0

retargeting:
  enabled: true
  embodiments:
    - franka_panda
    - dual_arm_franka
    - unitree_g1_upper
    - unitree_h1_upper
    - allegro_hand_right
    - teleop_glove
  embodiment_config_dir: configs/embodiments_v3
  ik_backend: auto
  clamp_workspace_reach: true
  enforce_joint_limits: true
  enforce_table_clearance: true
  table_z_margin_m: 0.01
  smoothness_window: 7

export:
  formats:
    - lerobot_v3
    - rlds
    - hdf5
    - parquet_json
  include_groot_modality_json: true
  sharded_lerobot_v3: true
  generate_dataset_card: true
  video_crf: 20
  render_qa_overlay: true
  export_3d_viewer: true
  generate_html_report: true

privacy:
  enable_face_blur: true
  enable_ocr_blur: false
  strip_audio: true
  verify_zero_unblurred_faces: true
  use_gpu_blur: true
  use_nvenc: true
  blur_sigma: 28.0
