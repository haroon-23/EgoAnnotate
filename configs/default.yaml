# EgoAnnotatePipeline Configuration file

pipeline:
  target_fps: 30
  image_size: [224, 224]
  frames_dir: "./data/frames"
  output_dir: "./data/output"

hand_tracking:
  running_mode: "VIDEO"
  num_hands: 2
  min_detection_confidence: 0.3
  min_tracking_confidence: 0.5
  smoothing_window: 5

object_detection:
  keyframes_per_video: 3
  bbox_keyframe_interval: 15
  prompt: |
    Analyze this egocentric video frame. List ALL objects that the person's hands are interacting with or could interact with. For each object, provide name, location in frame, and whether touched. Format as JSON list.

contact_detection:
  proximity_threshold_px: 25
  fingertip_indices: [4, 8, 12, 16, 20]

grasp_classification:
  pinch_threshold: 0.05
  wrap_threshold: 0.15

action_computation:
  compute_wrist_delta: true
  compute_finger_angles: true
  compute_gripper_state: true
  normalize_actions: true

# Signal-based temporal segmentation (deterministic, no VLM)
signal_segmentation:
  min_segment_duration_sec: 0.2
  merge_gap_sec: 0.3
  idle_threshold_sec: 1.0

# VLM-based segment labeling (Gemini)
segment_labeling:
  # Uses gemini.model from above

language_annotation:
  episode_prompt: "Describe the physical task in this video in one sentence. Be specific. Return ONLY the sentence."
  segment_prompt: "Describe what is happening in this video segment. Focus on hand, object, grasp type, motion."

gemini:
  model: "gemini-1.5-flash"
  api_key: null  # Set via GEMINI_API_KEY env var

grounding_dino:
  model_name: "IDEA-Research/grounding-dino-tiny"
  confidence_threshold: 0.3
  box_threshold: 0.3
  text_threshold: 0.25

output:
  format: "json"
  include_image_bytes: false
  save_viz_video: true
