# EgoAnnotatePipeline Configuration file

pipeline:
  target_fps: 30
  image_size: [224, 224]
  frames_dir: "./data/frames"
  output_dir: "./data/output"

hand_tracking:
  running_mode: "VIDEO"
  num_hands: 2
  min_detection_confidence: 0.3
  min_tracking_confidence: 0.5
  smoothing_window: 5

object_detection:
  keyframes_per_video: 3
  bbox_keyframe_interval: 15
  # vlm_backend: "local"  # Phase D opt-in: use the local SmolVLM backend for this stage
  prompt: |
    Analyze this egocentric video frame. List ALL objects that the person's hands are interacting with or could interact with. For each object, provide name, location in frame, and whether touched. Format as JSON list.

contact_detection:
  proximity_threshold_px: 25
  fingertip_indices: [4, 8, 12, 16, 20]

grasp_classification:
  pinch_threshold: 0.05
  wrap_threshold: 0.15

action_computation:
  compute_wrist_delta: true
  compute_finger_angles: true
  compute_gripper_state: true
  normalize_actions: true

# Signal-based temporal segmentation (deterministic, no VLM)
signal_segmentation:
  min_segment_duration_sec: 0.2
  merge_gap_sec: 0.3
  idle_threshold_sec: 1.0

# VLM-based segment labeling (Gemini)
segment_labeling:
  # Uses gemini.model from above
  # vlm_backend: "local"  # Phase D opt-in: use the local SmolVLM backend for this stage

language_annotation:
  episode_prompt: "Describe the physical task in this video in one sentence. Be specific. Return ONLY the sentence."
  segment_prompt: "Describe what is happening in this video segment. Focus on hand, object, grasp type, motion."

gemini:
  model: "gemini-3.8-flash"
  api_key: null  # Set via GEMINI_API_KEY env var

# Phase D: VLM dual backend. `backend: "gemini"` (default, production) or
# `"local"` (SmolVLM-500M-Instruct via transformers, CPU-only, offline/dev).
# Each stage also accepts its own `vlm_backend:` override ("gemini"|"local"):
# `local` is allowed for object_detection and segment_labeling; the video
# stages (action segmentation, language annotation) keep the `gemini` default
# because they rely on native video understanding.
vlm:
  backend: "gemini"
  # --- local backend (SmolVLM-500M-Instruct, CPU) ---
  local_model: "HuggingFaceTB/SmolVLM-500M-Instruct"
  local_weights: "models/smolvlm-500m-instruct"  # manual download; NO auto-download (Phase C rule)
  device: "cpu"
  max_new_tokens: 256
  temperature: 0.1
  video_frames: 8        # stills sampled to replace Gemini video upload
  timeout_s: 300         # old-Intel CPU inference is slow; fail loud, don't hang
  # --- fallback policy ---
  on_unavailable: "degrade"  # "degrade" = existing per-stage fallbacks; never silently wrong

grounding_dino:
  model_name: "google/owlvit-base-patch32"
  confidence_threshold: 0.1
  box_threshold: 0.1
  text_threshold: 0.1

# Phase C perception. The legacy `grounding_dino:` section above still works as
# an alias: settings it defines fill in anything the `perception:` section below
# does not override.
perception:
  detector_backend: "owlvit"   # "owlvit" (default, installed) | "grounding_dino" (opt-in) | "locate_anything" (opt-in, research-only)
  # Real Grounding DINO (IDEA-Research, SwinT_OGC) — only used when
  # detector_backend is "grounding_dino". NOTE: this is NOT OpenMMLab's
  # MM-Grounding-DINO (mmcv/mmdet has no usable macOS-Intel wheels, so the
  # MM variant is uninstallable on the 2017 Intel Mac dev machine).
  grounding_dino_weights: "models/groundingdino_swint_ogc.pth"
  grounding_dino_config: "models/GroundingDINO_SwinT_OGC.py"
  box_threshold: 0.30
  text_threshold: 0.25
  # NVIDIA LocateAnything-3B — only used when detector_backend is
  # "locate_anything". Open-vocab visual grounding VLM (MoonViT + Qwen2.5-3B);
  # the pipeline's accuracy oracle for cluttered scenes.
  # LICENSE: NVIDIA non-commercial, research-only weights — eval/research use,
  # not the commercial default (OWL-ViT stays the commercial path).
  # Manual download, no auto-download: https://huggingface.co/nvidia/LocateAnything-3B
  locate_anything_weights: "models/locate-anything-3b"

# Phase C: SAM 2 box-prompted masks. Off by default — even the tiny checkpoint
# is tens of seconds per image on old Intel CPUs. Run on keyframes only.
sam2:
  enabled: false
  checkpoint: "models/sam2.1_hiera_tiny.pt"
  config: "sam2_hiera_t"   # yaml path, or a name resolved inside the sam2 package
  device: "cpu"

# Phase C: metric depth. "unidepth" needs models/unidepth_v1.onnx (manual
# download, see README); "none" is an explicit no-depth choice (not an error).
depth:
  backend: "unidepth"
  model_path: "models/unidepth_v1.onnx"
  keyframe_only: true   # estimate on detection keyframes, cache float16 .npy to <episode>/depth/

# Phase C: pinhole intrinsics (pixels) for the processed frame resolution.
# Null = unknown -> 3D back-projection and PnP refinement skip with a warning.
# Contact/grasp semantics stay 2D regardless (depth-informed contact is future work).
camera:
  fx: null
  fy: null
  cx: null
  cy: null

# Phase C: PnP hand-pose refinement (pure cv2/numpy, no heavy deps).
# Recovers metric wrist translation from MediaPipe landmarks + the 0.090 m
# anthropometric hand reference. Needs `camera:` intrinsics; per-frame failures
# fall back to the existing estimates.
pnp_refinement:
  enabled: true

output:
  format: "json"
  include_image_bytes: false
  save_viz_video: true           # Internal debug HUD (224×224) → debug_hud_preview.mp4
  save_overlay_video: true       # Client-facing native-res overlay → overlay_annotated.mp4

retargeting:
  enable: true
  config_path: "configs/retargeting_franka.yaml"
  save_proof_video: true
  # Phase E: physics verification gate (Stage 9b; opt-in, default off).
  # Replays the exported episode HDF5 in MuJoCo with weld-grasp trials and
  # sets the physics_verified label (+ physics_verification.json). Episodes
  # are NEVER dropped — a failed gate only withholds the label.
  # Needs: pip install mujoco  (no weight downloads; the URDF is enough)
  physics_verify:
    enable: false
    tracking_err_rad_max: 0.15  # M1 gate: mean max|q - q_cmd| over reachable frames
    lift_min_m: 0.02            # per-window trial: minimum object lift
    grasp_proximity_m: 0.09     # 2D EE-to-object distance required at grasp frame
    min_reachable_pct: 50.0     # minimum % of kinematically reachable frames

# LeRobot export (Phase A task 2). Two modes:
#   human = 24D human motion (wrist pose + hand pose + gripper) — vision-language
#           training on human demonstration trajectories.
#   robot = 8D robot-native absolute joint positions + gripper (j1..j7 rad,
#           gripper_m) for the target embodiment in `target_embodiment` — for
#           ACT / diffusion-policy / VLA training. Episodes whose HDF5 lacks
#           `observation/robot_joint_angles` (no retargeting ran) are EXCLUDED
#           from robot-mode exports — never zero-padded.
export:
  mode: "human"
  target_embodiment: "franka"   # must match a robot in the embodiment registry
  action_convention: "absolute_joint_positions"  # do not change
  chunk_size: 1000
  camera: "observation.images.ego"
  fps: 30                        # fallback when video has no fps tag

# Phase B: merge per-episode lerobot_v3/ exports into one training dataset.
# scripts/merge_lerobot.py is also standalone-runnable (see --help).
merge:
  output_subdir: "merged_lerobot_v3"  # relative to the pipeline output_dir
  chunk_size: 1000                    # frames per data chunk (own setting)

# Phase B: ACT CPU smoke-train (scripts/train_act_smoke.py). Wiring proof —
# not a good policy. Real policy quality is Phase D/E.
training:
  chunk_size: 16     # ACT action chunk length k (8-32)
  steps: 50
  batch_size: 8
  lr: 1.0e-4
  seed: 0
  image_size: 96     # frames resized to image_size x image_size
  kl_beta: 10.0      # ACT paper KL weight
