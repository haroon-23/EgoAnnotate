[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egoannotate"
version = "4.0.0"
description = "Commercial egocentric video to robot-ready VLA & multi-embodiment LeRobot v3.0 data engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.14,<0.10.30",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0.0,<20.0.0",
    "h5py>=3.10.0",
    "torch>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
gpu = [
    "transformers>=4.49.0",
    "accelerate>=0.34.0",
    "huggingface_hub>=0.25.0",
    "timm>=1.0.0",
    "num2words>=0.5.13",
]
v4 = [
    "rtmlib>=0.0.13",
    "onnxruntime-gpu>=1.19.0",
    "rapidocr-onnxruntime>=1.3.0",
    "ray[data]>=2.35.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[project.scripts]
egoannotate = "src.egoannotate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
